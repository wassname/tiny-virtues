[project]
name = "tiny-virtues"
version = "0.5.0"
description = "Private development tools for quoted moral scenarios and tradition-specific labels"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4,<6",
    "httpx>=0.28,<0.29",
    "loguru==0.7.3",
    "numpy==2.5.3",
    "polars>=1,<2",
    "pyarrow>=20,<30",
    "scipy>=1.16,<2",
    "tabulate>=0.9,<0.10",
]

[project.optional-dependencies]
eval = [
    "inspect-ai>=0.3.277",
    "inspect-scout>=0.5.4,<0.6",
    "openai>=1.0",
]
plots = [
    "matplotlib>=3.9,<4",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
